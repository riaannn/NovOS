<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Plants vs Zombies Fusion</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #unity-canvas {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: block;
    }

    /* Fullscreen NovOS Transition Overlay */
    #loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url("https://cdn2.steamgriddb.com/hero_thumb/19316b8689a5a7fa2a496ffa49c81862.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    /* Centered NovOS Splash Layout */
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* App Icon Styling */
    .app-icon {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      background: #1e1e24;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* App Label */
    .app-name {
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    /* Minimalist NovOS Progress Bar */
    .progress-bar-container {
      width: 180px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      transition: width 0.2s ease;
    }

    .status-text {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.75rem;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Seamless NovOS Loader -->
  <div id="loader-overlay">
    <div class="splash-container">
      <div class="app-icon">
        <img src="https://cdn2.steamgriddb.com/icon_thumb/043555cbce9685a223341da753a18198.png" alt="Plants vs Zombies Fusion Icon">
      </div>
      <div class="app-name">Plants vs Zombies Fusion</div>
      <div class="progress-bar-container">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="status-text" class="status-text">0%</div>
    </div>
  </div>

  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script>
    window.alert = function (m) { console.warn("[unity alert]", m); };
    window.unityShowBanner = function (msg, type) { console.warn("[unity banner " + (type || "info") + "]", msg); };

    var repoBase = "https://fastly.jsdelivr.net/gh/riaannn/pvzfusion@master/";
    var buildUrl = repoBase + "Build/";

    const TOTAL_SYSTEM_PARTS = 14;
    let currentGlobalPart = 0;

    function updateProgress() {
      const percentage = Math.round((currentGlobalPart / TOTAL_SYSTEM_PARTS) * 100);
      document.getElementById('progress-fill').style.width = `${percentage}%`;
      document.getElementById('status-text').innerText = `${percentage}%`;
    }

    async function fetchAndMergeParts(baseFileName, totalParts, useZeroPadding = true) {
      const buffers = [];

      for (let i = 1; i <= totalParts; i++) {
        const partNumber = useZeroPadding ? String(i).padStart(2, '0') : i;
        const partUrl = `${buildUrl}${baseFileName}.part${partNumber}`;
        
        const response = await fetch(partUrl);
        if (!response.ok) {
          throw new Error(`Failed to fetch ${partUrl} (Status: ${response.status})`);
        }
        const arrayBuffer = await response.arrayBuffer();
        buffers.push(arrayBuffer);

        currentGlobalPart++;
        updateProgress();
      }

      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    async function initGame() {
      try {
        const dataBlobUrl = await fetchAndMergeParts("build.data", 12, true); 
        const wasmBlobUrl = await fetchAndMergeParts("build.wasm", 2, false);

        var config = {
          dataUrl: dataBlobUrl,
          frameworkUrl: buildUrl + "build.framework.js",
          codeUrl: wasmBlobUrl,
          streamingAssetsUrl: repoBase + "StreamingAssets",
          companyName: "LanPiaoPiao",
          productName: "PlantsVsZombiesRH",
          productVersion: "1.0",
        };

        var canvas = document.querySelector("#unity-canvas");
        var script = document.createElement("script");
        script.src = buildUrl + "build.loader.js";
        script.crossOrigin = "anonymous";

        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            const unityPercentage = Math.round(progress * 100);
            if (unityPercentage > 0) {
              document.getElementById('status-text').innerText = `Starting... ${unityPercentage}%`;
            }
          }).then(() => {
            const overlay = document.getElementById('loader-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
          }).catch((err) => {
            console.error("Unity Initialization Error:", err);
          });
        };

        document.body.appendChild(script);
      } catch (err) {
        console.error("Failed to load game assets:", err);
        document.getElementById('status-text').innerText = "Load failed";
        document.getElementById('status-text').style.color = "#ff6b6b";
      }
    }

    initGame();
  </script>
</body>
</html>
