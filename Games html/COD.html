<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cod Environment Launcher</title>
    <base href="https://esm.sh/gadidae@0.2.0/">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #boot-screen {
            text-align: center;
            text-shadow: 0 0 5px #00ff00;
        }
        .spinner {
            margin: 20px auto;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 255, 0, 0.1);
            border-radius: 50%;
            border-top-color: #00ff00;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(3600deg); }
        }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="spinner"></div>
        <div>MOUNTING VIRTUAL CORE...</div>
    </div>

    <script type="module">
        async function bootSystem() {
            try {
                // Import the specific version bundle with full dependency matching enabled
                await import("https://esm.sh/gadidae@0.2.0?bundle");
                
                // Clear out loading visuals once runtime renders the workspace graphics
                const bootScreen = document.getElementById('boot-screen');
                if (bootScreen) {
                    bootScreen.style.display = 'none';
                }
            } catch (err) {
                console.error("Boot failure:", err);
                document.body.innerHTML = `
                    <div style="color: #ff5555; padding: 20px; text-shadow: none; font-family: monospace;">
                        <strong>SYSTEM_HALT: Failed to load environment dependencies.</strong><br>
                        Detail: ${err.message}<br><br>
                        <em>Tip: If modern asset protection policies block this file locally, serve the file directory via a local host interface (e.g., Live Server) to bypass local file restrictions.</em>
                    </div>`;
            }
        }

        // Initialize execution path
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootSystem);
        } else {
            bootSystem();
        }
    </script>
</body>
</html>
