<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovOS Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #08080c;
            --bg-bar: #0f0f16;
            --bg-sidebar: #0b0b11;
            --bg-editor: #12121a;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.15);
            --border: rgba(255, 255, 255, 0.06);
            --text-main: #f3f4f6;
            --text-muted: #6c7281;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Geist', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-main); color: var(--text-main); overflow: hidden; }
        .container { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
        .control-bar { background-color: var(--bg-bar); padding: 10px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
        .brand { font-weight: 700; font-size: 14px; color: #fff; margin-right: 12px; display: flex; align-items: center; gap: 8px; }
        .brand-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        .input-wrapper { flex: 1; display: flex; gap: 8px; align-items: center; }
        .url-input { width: 100%; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; color: #fff; font-family: 'Geist Mono', monospace; font-size: 13px; outline: none; }
        .url-input:focus { border-color: var(--accent); }
        .workspace { flex: 1; display: flex; width: 100%; overflow: hidden; }
        .editor-workspace { display: flex; width: 50vw; height: 100%; background-color: var(--bg-editor); border-right: 1px solid var(--border); position: relative; }
        .editor-sidebar { width: 180px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .sidebar-section h3 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .lang-list { display: flex; flex-direction: column; gap: 4px; }
        .lang-item { padding: 8px 12px; border-radius: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
        .lang-item:hover { color: var(--text-main); }
        .lang-item.active { background: var(--accent-glow); color: #c084fc; font-weight: 600; }
        .editor-wrapper { flex: 1; display: flex; background: #0b0b10; position: relative; }
        .line-numbers { width: 44px; background: rgba(0,0,0,0.15); padding: 14px 0; text-align: right; padding-right: 10px; color: #3b3b4f; font-family: 'Geist Mono', monospace; font-size: 13px; line-height: 22px; user-select: none; overflow: hidden; }
        .raw-textarea { flex: 1; background: transparent; border: none; padding: 14px 16px; color: #e2e8f0; font-family: 'Geist Mono', monospace; font-size: 14px; line-height: 22px; outline: none; resize: none; overflow-y: auto; white-space: pre; }
        .btn { background-color: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: rgba(255,255,255,0.04); color: #cbd5e1; border: 1px solid var(--border); }
        .btn-ide { width: 100%; padding: 10px; justify-content: center; }
        .viewer-panel { flex: 1; height: 100%; position: relative; background-color: var(--bg-main); }
        #novosViewerFrame { width: 100%; height: 100%; border: none; background-color: #fff; display: block; }
        #virtualConsole { width: 100%; height: 100%; background: #060608; padding: 24px; font-family: 'Geist Mono', monospace; overflow-y: auto; box-sizing: border-box; }
        .terminal-row { font-size: 14px; line-height: 1.6; color: #a78bfa; }
        .terminal-output { color: #e2e8f0; margin-left: 12px; white-space: pre-wrap; }
        .status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 80%; }
        .status-msg.error { color: #f87171; font-family: 'Geist Mono', monospace; }
        .status-msg.loading { color: var(--text-muted); }
        .hidden { display: none !important; }
        .fullscreen .control-bar, .fullscreen .editor-workspace { display: none !important; }
        #exitFullscreenBtn { position: fixed; top: 14px; right: 14px; z-index: 9999; background: rgba(15, 15, 22, 0.9); color: #e1e1e6; border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: none; }
        .fullscreen #exitFullscreenBtn { display: block; }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <button id="exitFullscreenBtn">Exit Fullscreen (Esc)</button>
        <header class="control-bar" id="controlBar">
            <div class="brand"><div class="brand-dot"></div>Studio</div>
            <button class="btn btn-secondary" id="toggleModeBtn">Code Workspace Mode</button>
            <div class="input-wrapper" id="urlInputWrapper">
                <input type="url" id="rawUrl" class="url-input" placeholder="Paste GitHub Raw URL here..." spellcheck="false">
            </div>
            <button class="btn" id="compileBtn">Run Viewport</button>
            <button class="btn btn-secondary" id="fullscreenBtn">Fullscreen</button>
        </header>

        <div class="workspace">
            <div class="editor-workspace hidden" id="editorWorkspace">
                <div class="editor-sidebar">
                    <div class="sidebar-section">
                        <h3>Language</h3>
                        <div class="lang-list">
                            <div class="lang-item active" data-lang="html">HTML5</div>
                            <div class="lang-item" data-lang="python">Python</div>
                            <div class="lang-item" data-lang="java">Java</div>
                            <div class="lang-item" data-lang="csharp">C#</div>
                            <div class="lang-item" data-lang="cpp">C++</div>
                        </div>
                    </div>
                    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
                        <button class="btn btn-ide" id="ideRunBtn">Run Code</button>
                        <button class="btn btn-secondary btn-ide" id="ideClearBtn">Clear</button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div class="line-numbers" id="lineCounter">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15</div>
                    <textarea id="rawHtmlInput" class="raw-textarea" spellcheck="false"></textarea>
                </div>
            </div>

            <main class="viewer-panel">
                <div id="placeholderMsg" class="status-msg">
                    <p style="font-size: 13px; color: var(--text-muted); font-family: 'Geist Mono', monospace;">[System ready. Run code matrices or input a tracking repository link context to view workspace.]</p>
                </div>
                <iframe id="novosViewerFrame" class="hidden"></iframe>
                <div id="virtualConsole" class="hidden"></div>
            </main>
        </div>
    </div>

    <script>
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = ''; 
        });

        const appContainer = document.getElementById('appContainer');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const urlInputWrapper = document.getElementById('urlInputWrapper');
        const editorWorkspace = document.getElementById('editorWorkspace');
        const rawUrlInput = document.getElementById('rawUrl');
        const rawHtmlInput = document.getElementById('rawHtmlInput');
        const lineCounter = document.getElementById('lineCounter');
        const compileBtn = document.getElementById('compileBtn');
        const ideRunBtn = document.getElementById('ideRunBtn');
        const ideClearBtn = document.getElementById('ideClearBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
        const viewerFrame = document.getElementById('novosViewerFrame');
        const virtualConsole = document.getElementById('virtualConsole');
        const placeholderMsg = document.getElementById('placeholderMsg');
        
        let currentBlobURL = null;
        let isUrlMode = true;
        let selectedLanguage = "html";

        const boilerplates = {
            html: "<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        body { background: #0b0b11; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }\n    </style>\n</head>\n<body>\n    <h2>Workspace Live Preview Window</h2>\n</body>\n</html>",
            python: "print(\"Initializing workspace matrix...\")\nprint(\"Python evaluation script executed successfully.\")",
            java: "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Java compilation successful.\");\n    }\n}",
            csharp: "using System;\nclass Program {\n    static void Main() {\n        Console.WriteLine(\"C# Environment online.\");\n    }\n}",
            cpp: "#include <iostream>\nint main() {\n    std::cout << \"C++ Engine Execution Complete.\" << std::endl;\n    return 0;\n}"
        };

        rawHtmlInput.value = boilerplates.html;

        rawHtmlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                rawHtmlInput.dispatchEvent(new Event('input'));
            }

            const pairs = { '(': ')', '{': '}', '[': ']', '"': '"', "'": "'" };
            if (pairs[e.key] !== undefined) {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                const closeChar = pairs[e.key];
                this.value = this.value.substring(0, start) + e.key + closeChar + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
                rawHtmlInput.dispatchEvent(new Event('input'));
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                const start = this.selectionStart;
                const textBeforeCursor = this.value.substring(0, start);
                const textAfterCursor = this.value.substring(start);
                
                const lines = textBeforeCursor.split('\n');
                const currentLine = lines[lines.length - 1];
                const indentMatch = currentLine.match(/^(\s*)/);
                const indent = indentMatch ? indentMatch[1] : '';

                this.value = textBeforeCursor + '\n' + indent + textAfterCursor;
                this.selectionStart = this.selectionEnd = start + 1 + indent.length;
                rawHtmlInput.dispatchEvent(new Event('input'));
            }
        });

        document.querySelectorAll('.lang-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.lang-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                selectedLanguage = item.getAttribute('data-lang');
                rawHtmlInput.value = boilerplates[selectedLanguage];
                rawHtmlInput.dispatchEvent(new Event('input'));
            });
        });

        toggleModeBtn.addEventListener('click', () => {
            isUrlMode = !isUrlMode;
            if (isUrlMode) {
                toggleModeBtn.textContent = "Code Workspace Mode";
                urlInputWrapper.classList.remove('hidden');
                editorWorkspace.classList.add('hidden');
                compileBtn.classList.remove('hidden');
            } else {
                toggleModeBtn.textContent = "URL Repository Mode";
                urlInputWrapper.classList.add('hidden');
                editorWorkspace.classList.remove('hidden');
                compileBtn.classList.add('hidden');
            }
        });

        rawHtmlInput.addEventListener('input', () => {
            const lines = rawHtmlInput.value.split('\n').length;
            let countHTML = '';
            for (let i = 1; i <= Math.max(lines, 15); i++) { countHTML += i + '<br>'; }
            lineCounter.innerHTML = countHTML;
            lineCounter.scrollTop = rawHtmlInput.scrollTop;
        });

        rawHtmlInput.addEventListener('scroll', () => { lineCounter.scrollTop = rawHtmlInput.scrollTop; });
        ideClearBtn.addEventListener('click', () => {
            rawHtmlInput.value = '';
            rawHtmlInput.dispatchEvent(new Event('input'));
        });

        async function compileAndRun() {
            placeholderMsg.className = "status-msg loading";
            placeholderMsg.innerHTML = '<p style="font-size: 13px; font-family: \'Geist Mono\', monospace;">[Compiling workspace environments...]</p>';
            viewerFrame.classList.add('hidden');
            virtualConsole.classList.add('hidden');

            if (currentBlobURL) { URL.revokeObjectURL(currentBlobURL); }
            let targetHTML = "";

            if (isUrlMode) {
                let targetURL = rawUrlInput.value.trim();
                if (!targetURL) { resetPlaceholder(); return; }
                if (targetURL.includes('github.com') && !targetURL.includes('raw.githubusercontent.com')) {
                    targetURL = targetURL.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                    rawUrlInput.value = targetURL;
                }
                try {
                    const response = await fetch(targetURL);
                    if (!response.ok) throw new Error("Status: " + response.status);
                    targetHTML = await response.text();
                    selectedLanguage = "html";
                } catch (err) {
                    showError(err.message);
                    return;
                }
            } else {
                targetHTML = rawHtmlInput.value;
                if (!targetHTML.trim()) { resetPlaceholder(); return; }
            }

            if (targetHTML.includes('ykJYJgqRQvLQ')) {
                targetHTML = targetHTML.replace(/<script>\(function\(ykJYJgqRQvLQ[\s\S]*?<\/script>/, '');
            }

            placeholderMsg.classList.add('hidden');

            if (selectedLanguage === "html") {
                const fileBlob = new Blob([targetHTML], { type: 'text/html' });
                currentBlobURL = URL.createObjectURL(fileBlob);
                viewerFrame.classList.remove('hidden');
                viewerFrame.src = currentBlobURL;
            } else {
                virtualConsole.classList.remove('hidden');
                simulateConsole(selectedLanguage, targetHTML);
            }
        }

        function simulateConsole(lang, editedCode) {
            let outputLines = [];
            const textLines = editedCode.split('\n');

            textLines.forEach(line => {
                let trimmed = line.trim();
                if (lang === "python" && trimmed.startsWith("print(")) {
                    let match = trimmed.match(/print\((["'])(.*?)\1\)/);
                    if (match) outputLines.push(match[2]);
                }
                if (lang === "java" && trimmed.includes("System.out.println(")) {
                    let match = trimmed.match(/System\.out\.println\((["'])(.*?)\1\)/);
                    if (match) outputLines.push(match[2]);
                }
                if (lang === "csharp" && trimmed.includes("Console.WriteLine(")) {
                    let match = trimmed.match(/Console\.WriteLine\((["'])(.*?)\1\)/);
                    if (match) outputLines.push(match[2]);
                }
                if (lang === "cpp" && trimmed.includes("cout")) {
                    let match = trimmed.match(/cout\s*<<\s*(["'])(.*?)\1/);
                    if (match) outputLines.push(match[2]);
                }
            });

            if (outputLines.length === 0) {
                outputLines.push("[Program executed with no standard console logs produced]");
            }

            let renderedOutput = outputLines.join('\n');

            virtualConsole.innerHTML = `
                <div class="terminal-row">&gt; execution-engine --lang=${lang}</div>
                <div class="terminal-output" style="color: #4ade80; margin-top: 6px;">empty</div>
                <div class="terminal-row" style="color: #6b7280; margin-top: 12px;">Process complete (Exit code: 0)</div>
            `;
            virtualConsole.querySelector('.terminal-output').textContent = renderedOutput;
        }

        function showError(msg) {
            placeholderMsg.className = "status-msg error";
            placeholderMsg.innerHTML = `<p>[!] Environment Core Error Exception</p><p style="color: #6b7280; margin-top:4px;">${msg}</p>`;
        }

        function resetPlaceholder() {
            placeholderMsg.className = "status-msg";
            placeholderMsg.innerHTML = '<p style="font-size: 13px; color: var(--text-muted); font-family: \'Geist Mono\', monospace;">[System ready. Run code matrices or input a tracking repository link context to view workspace.]</p>';
        }

        compileBtn.addEventListener('click', compileAndRun);
        ideRunBtn.addEventListener('click', compileAndRun);
        fullscreenBtn.addEventListener('click', () => appContainer.classList.add('fullscreen'));
        exitFullscreenBtn.addEventListener('click', () => appContainer.classList.remove('fullscreen'));
        rawUrlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') compileAndRun(); });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') appContainer.classList.remove('fullscreen'); });
    </script>
</body>
</html>
