<!DOCTYPE html>
<html>

<head>
    <base href="https://rawcdn.githack.com/bubbls/youtube-playables/main/bowmasters/">
    <title>Bowmasters</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-touch-fullscreen" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="msapplication-tap-highlight" content="no"/>
    <meta name="MobileOptimized" content="960"/>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui"/>
    <meta charset="utf-8"/>

    <link rel="stylesheet" type="text/css" href="style/index.css"/>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            color: white;
            font-family: sans-serif;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        #start-overlay h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffcc00;
        }
        #start-overlay p {
            font-size: 1.2rem;
            color: #ccc;
        }
    </style>

    <!-- Fully Patched YouTube Playables SDK Mock -->
    <script>
        window.ytgame = {
            isSupported: function() { return true; },
            game: {
                preloadAssets: function() { return Promise.resolve(); },
                setLoadingProgress: function() {},
                gameReady: function() {},
                firstFrameReady: function() {},
                loadData: function() { return Promise.resolve("{}"); },
                saveData: function() { return Promise.resolve(); },
                score: {
                    submit: function() {}
                },
                audio: {
                    setMuted: function() {}
                }
            },
            system: {
                getLanguage: function() { return "en"; },
                isAudioEnabled: function() { return true; },
                onAudioEnabledChange: function() {},
                onPause: function() {},
                onResume: function() {}
            },
            health: {
                logError: function() {},
                logWarning: function() {}
            },
            player: {
                getData: function() { return Promise.resolve({}); }
            }
        };
    </script>

    <script src="https://rawcdn.githack.com/bubbls/youtube-playables/main/ytgame.js"></script>
    <script src="game.js"></script>
</head>

<body>
    <div id="start-overlay" onclick="startGameSession()">
        <h1>Bowmasters</h1>
        <p>Click anywhere or tap to start game</p>
    </div>

    <div id="game"></div>

    <script>
        let gameStarted = false;

        function startGameSession() {
            if (gameStarted) return;
            gameStarted = true;

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 300);

            if (typeof window.runGame === "function") {
                window.runGame();
            } else {
                console.error("runGame function is not defined.");
            }
        }
    </script>
</body>
</html>
