<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloaked Launcher</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #05070a 100%);
            --surface: #0f172a;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh; width: 100vw;
            line-height: 1.6; overflow: hidden; 
        }
        #safe-start {
            position: fixed; inset: 0; background: var(--bg-gradient);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999999; transition: opacity 0.6s ease, visibility 0.6s;
        }
        .loader-circle {
            width: 50px; height: 50px; border: 3px solid var(--glass);
            border-top: 3px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; height: 100%; overflow-y: auto; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .logo-box { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        .search-container { margin-bottom: 40px; display: flex; justify-content: center; gap: 10px; }
        .search-input {
            width: 100%; max-width: 500px; padding: 14px 24px; border-radius: 18px;
            background: var(--glass); border: 1px solid var(--border); color: white;
            font-size: 1rem; outline: none; transition: var(--transition);
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding-bottom: 40px; }
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 25px; text-align: center; transition: var(--transition); position: relative; }
        .card:hover { border-color: var(--accent); transform: translateY(-8px); background: rgba(255,255,255,0.06); }
        .card-icon { width: 80px; height: 80px; border-radius: 22px; margin-bottom: 20px; object-fit: cover; cursor: pointer; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn { padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: 600; border: 1px solid var(--border); background: var(--glass); color: var(--text-main); transition: var(--transition); font-size: 12px; flex: 1; outline: none; }
        .btn-primary { background: var(--accent); border: none; color: white; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; }
        .tab.active { background: var(--accent); color: white; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal.active { display: flex; }
        .modal-content { background: #0f172a; padding: 40px; border-radius: 32px; width: 90%; max-width: 480px; border: 1px solid var(--border); }
        .edit-input { width: 100%; border-radius: 12px; padding: 10px 15px; background: var(--glass); border: 1px solid var(--border); color: white; margin-bottom: 15px;}
    </style>
</head>
<body>
<div id="safe-start">
    <div class="loader-circle"></div>
    <div style="font-weight: 800; letter-spacing: 2px; color: var(--accent);">INITIALIZING GRID...</div>
</div>
<div class="container">
    <header>
        <div class="logo"><div class="logo-box"></div> CLOAKED</div>
        <div style="display: flex; gap: 12px;">
            <button class="btn btn-primary" onclick="UI.toggleModal('altLinksModal', true)">ALTERNATE LINKS</button>
            <button class="btn" onclick="UI.toggleModal('settingsModal', true)">CLOAK</button>
        </div>
    </header>
    <div class="search-container">
        <input type="text" class="search-input" id="searchBar" placeholder="Search or Enter URL..." oninput="UI.renderGrid()">
        <button class="btn btn-primary" style="flex: 0 1 auto; width: 120px;" onclick="UI.openAddModal()">+ ADD NEW</button>
    </div>
    <div class="tabs" id="tabBar">
        <button class="btn tab" onclick="UI.switchTab('web')">WEB</button>
        <button class="btn tab active" onclick="UI.switchTab('games')">GAMES</button>
        <button class="btn tab" onclick="UI.switchTab('apps')">APPS</button>
    </div>
    <div class="grid" id="mainGrid"></div>
</div>

<div class="modal" id="editModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-bottom: 20px;">Edit Shortcut</h2>
        <input type="text" id="editName" class="edit-input" placeholder="Name">
        <input type="text" id="editUrl" class="edit-input" placeholder="URL">
        <input type="text" id="editIcon" class="edit-input" placeholder="Icon URL">
        <div class="btn-group">
            <button class="btn btn-primary" onclick="UI.saveShortcut()">SAVE</button>
            <button id="deleteBtn" class="btn btn-danger" onclick="UI.deleteShortcut()">DELETE</button>
            <button class="btn" onclick="UI.toggleModal('editModal', false)">CANCEL</button>
        </div>
    </div>
</div>

<div class="modal" id="altLinksModal">
    <div class="modal-content">
        <h2>Alternate Links</h2>
        <textarea style="width:100%; height:150px; background:rgba(0,0,0,0.2); color:var(--accent); border-radius:12px; padding:15px; border:1px solid var(--border); margin-top:15px;" readonly>
Truffled: computerlab.strangled.net
Granny: https://riaannn.github.io/Granny/
        </textarea>
        <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="UI.toggleModal('altLinksModal', false)">CLOSE</button>
    </div>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h2 style="margin-bottom: 24px; text-align: center;">Tab Disguise</h2>
        <div id="presetGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;"></div>
        <button class="btn btn-danger" style="width: 100%; margin-top: 20px;" onclick="UI.forceReset()">FORCE RESET ALL DATA</button>
        <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="UI.toggleModal('settingsModal', false)">SAVE</button>
    </div>
</div>

<script>
window.onload = function() {
    const loader = document.getElementById('safe-start');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.visibility = 'hidden'; }, 600);
};

window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = '';
});

const DEFAULT_SHORTCUTS = {
    web: [
        {name: "GN Math", url: "https://genizymath.github.io/", icon: "https://genizymath.github.io/images/favicon.png", isDefault: true},
        {name: "AnuraOS", url: "https://anura.pro", icon: "https://i.imgur.com/6vvxLxR.jpeg", isDefault: true}
    ],
    games: [
        {name: "Angry Birds Epic", url: "https://riaannn.github.io/Angry-Birds-Epic/", icon: "https://i.imgur.com/ql7Gz9e.jpeg", isDefault: true},
        {name: "Bad Piggies", url: "https://riaannn.github.io/Bad-Piggies/", icon: "https://preview.redd.it/which-of-these-app-icons-is-the-best-in-your-opinion-for-v0-eooqvsjlfb971.png?width=185&format=png&auto=webp&s=e8267058bec260d939d0bdc052bb1c9bc4516787", isDefault: true},
        {name: "Baldi's Basics", url: "https://riaannn.github.io/Baldis-Basics/", icon: "https://play-lh.googleusercontent.com/EPV1TB4So1lB0DGrdCVExDpNU8ML67nd8OqBeoOIM-s6sDicxmDdPvCXD6n7LKevFl0", isDefault: true},
    ],
    apps: [
        {name: "WatchParty", url: "https://watchparty.me", icon: "https://www.watchparty.me/favicon.ico", isDefault: true}
    ],
    secrets: [
        {name: "Yandere Simulator", url: "https://riaannn.github.io/Yandere-Simulator/", icon: "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/i/8939caba-2c60-4aeb-bb20-d61b0458b178/daamgvz-d0dd1426-a94f-4a2e-97e2-c54cd9aa51cc.png", isDefault: true}
    ]
};

const DATA = {
    currentTab: "games",
    presets: [
        {id:"google", name:"Google", title:"Google", icon:"https://www.google.com/favicon.ico"},
        {id:"drive", name:"Drive", title:"My Drive - Google Drive", icon:"https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png"},
        {id:"canvas", name:"Canvas", title:"Dashboard", icon:"https://wdmcs.instructure.com/favicon.ico"}
    ],
    shortcuts: (() => {
        const userCustom = JSON.parse(localStorage.getItem("userCustomShortcuts")) || { web: [], games: [], apps: [], secrets: [] };
        return {
            web: [...DEFAULT_SHORTCUTS.web, ...userCustom.web],
            games: [...DEFAULT_SHORTCUTS.games, ...userCustom.games],
            apps: [...DEFAULT_SHORTCUTS.apps, ...userCustom.apps],
            secrets: [...DEFAULT_SHORTCUTS.secrets, ...userCustom.secrets]
        };
    })(),
    editingIndex: null,
    editingCategory: null,
    isEditingDefault: false
};

const Launcher = {
    selectedPreset: JSON.parse(localStorage.getItem("preset")) || DATA.presets[1],
    open(url) {
        if (!url.startsWith('http')) url = 'https://' + url;
        const win = window.open("about:blank", "_blank");
        if (!win) return alert("Enable popups!");
        win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>${this.selectedPreset.title}</title>
                <link rel="icon" href="${this.selectedPreset.icon}">
                <style>
                    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
                    iframe { border: none; width: 100%; height: 100%; }
                    #refresh-btn {
                        position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px;
                        background: #6366f1; color: white; border: none; border-radius: 50%;
                        cursor: pointer; display: flex; align-items: center; justify-content: center;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 9999; opacity: 0.6; transition: 0.3s;
                    }
                    #refresh-btn:hover { opacity: 1; transform: scale(1.1); }
                    #refresh-btn svg { width: 24px; height: 24px; fill: currentColor; }
                </style>
                <script>
                    window.addEventListener('beforeunload', (e) => {
                        e.preventDefault();
                        e.returnValue = '';
                    });

                    function checkFullscreen() {
                        const btn = document.getElementById('refresh-btn');
                        // Detection for F11: If inner height equals screen height, tab bar is hidden
                        const isF11 = window.innerHeight === window.screen.height;
                        const isStandardFS = !!document.fullscreenElement;
                        
                        if (isF11 || isStandardFS) {
                            btn.style.display = 'none';
                        } else {
                            btn.style.display = 'flex';
                        }
                    }

                    // Trigger on resize (handles F11 toggling) and standard fullscreen change
                    window.addEventListener('resize', checkFullscreen);
                    document.addEventListener('fullscreenchange', checkFullscreen);
                <\/script>
            </head>
            <body>
                <button id="refresh-btn" onclick="document.getElementById('content').src = document.getElementById('content').src;" title="Refresh Page">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
                <iframe id="content" src="${url}" allowfullscreen></iframe>
            </body>
            </html>
        `);
        win.document.close();
    },
    setPreset(id) {
        this.selectedPreset = DATA.presets.find(p => p.id === id);
        localStorage.setItem("preset", JSON.stringify(this.selectedPreset));
        UI.renderPresets();
    }
};

const UI = {
    renderGrid() {
        const grid = document.getElementById("mainGrid");
        const query = document.getElementById("searchBar").value.toLowerCase().trim();
        let displayItems = [];
        if (query.includes('.') || query.startsWith('http')) {
            displayItems.push({ name: "Open Direct Link", url: query, icon: "https://www.google.com/s2/favicons?domain=" + query, isDirect: true });
        }
        const tabItems = DATA.shortcuts[DATA.currentTab] || [];
        tabItems.forEach((item, index) => {
            if (query === "" || item.name.toLowerCase().includes(query)) {
                displayItems.push({ ...item, index, category: DATA.currentTab });
            }
        });
        if (query.includes("yandere")) {
            const secretItems = DATA.shortcuts.secrets || [];
            secretItems.forEach((item, index) => {
                if (item.name.toLowerCase().includes(query)) displayItems.push({ ...item, index, category: 'secrets' });
            });
        }
        grid.innerHTML = displayItems.map((item) => `
            <div class="card">
                <img src="${item.icon}" class="card-icon" onerror="this.src='https://i.imgur.com/ql7Gz9e.jpeg'" onclick="Launcher.open('${item.url}')">
                <div style="font-weight:600;">${item.name}</div>
                <div class="btn-group">
                    ${item.isDirect ? '' : `<button class="btn" onclick="UI.openEditModal('${item.category}', ${item.index})">Edit</button>`}
                </div>
            </div>`).join('');
    },
    switchTab(tab) {
        DATA.currentTab = tab;
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === tab));
        this.renderGrid();
    },
    openAddModal() {
        DATA.editingIndex = null;
        DATA.editingCategory = DATA.currentTab;
        DATA.isEditingDefault = false;
        document.getElementById("modalTitle").innerText = "Add Shortcut";
        document.getElementById("editName").value = document.getElementById("editUrl").value = document.getElementById("editIcon").value = "";
        document.getElementById("deleteBtn").style.display = "none";
        this.toggleModal("editModal", true);
    },
    openEditModal(category, index) {
        const item = DATA.shortcuts[category][index];
        DATA.editingIndex = index;
        DATA.editingCategory = category;
        DATA.isEditingDefault = !!item.isDefault;
        document.getElementById("modalTitle").innerText = "Edit Shortcut";
        document.getElementById("editName").value = item.name;
        document.getElementById("editUrl").value = item.url;
        document.getElementById("editIcon").value = item.icon;
        document.getElementById("deleteBtn").style.display = DATA.isEditingDefault ? "none" : "block";
        this.toggleModal("editModal", true);
    },
    saveShortcut() {
        const item = { 
            name: document.getElementById("editName").value, 
            url: document.getElementById("editUrl").value, 
            icon: document.getElementById("editIcon").value 
        };
        if (DATA.editingIndex === null) {
            DATA.shortcuts[DATA.editingCategory].push(item);
        } else {
            if (DATA.isEditingDefault) item.isDefault = true;
            DATA.shortcuts[DATA.editingCategory][DATA.editingIndex] = item;
        }
        this.sync();
    },
    deleteShortcut() {
        DATA.shortcuts[DATA.editingCategory].splice(DATA.editingIndex, 1);
        this.sync();
    },
    sync() {
        const customOnly = {
            web: DATA.shortcuts.web.filter(i => !i.isDefault),
            games: DATA.shortcuts.games.filter(i => !i.isDefault),
            apps: DATA.shortcuts.apps.filter(i => !i.isDefault),
            secrets: DATA.shortcuts.secrets.filter(i => !i.isDefault)
        };
        localStorage.setItem("userCustomShortcuts", JSON.stringify(customOnly));
        this.renderGrid();
        this.toggleModal("editModal", false);
    },
    forceReset() {
        if(confirm("Restore defaults and wipe custom shortcuts?")) {
            localStorage.removeItem("userCustomShortcuts");
            location.reload();
        }
    },
    toggleModal(id, show) {
        document.getElementById(id).classList.toggle('active', show);
        if (show && id === 'settingsModal') this.renderPresets();
    },
    renderPresets() {
        document.getElementById("presetGrid").innerHTML = DATA.presets.map(p => `
            <div onclick="Launcher.setPreset('${p.id}')" style="padding:10px; background:var(--glass); border-radius:10px; cursor:pointer; border:1px solid ${Launcher.selectedPreset.id === p.id ? 'var(--accent)' : 'transparent'}">
                <img src="${p.icon}" style="width:16px;"> ${p.name}
            </div>`).join('');
    }
};

UI.renderGrid();
</script>
</body>
</html>
